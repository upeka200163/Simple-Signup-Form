<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Panda Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="panda-container">
    <div class="panda" id="panda">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="face">
        <div class="blush left"></div>
        <div class="blush right"></div>
        <div class="eye-patch left"><div class="eyeball"></div></div>
        <div class="eye-patch right"><div class="eyeball"></div></div>
        <div class="nose"></div>
        <div class="mouth"></div>
      </div>
      <div class="hand left-hand"></div>
      <div class="hand right-hand"></div>
    </div>

    <div class="card">
      <h2>Sign Up Here</h2>

      <div class="field">
        <i class="fa fa-user"></i>
        <input type="text" placeholder="Enter Your Name">
      </div>

      <div class="field">
        <i class="fa fa-envelope"></i>
        <input type="email" placeholder="Enter Email">
      </div>

      <div class="field">
        <i class="fa fa-lock"></i>
        <input type="password" class="password-trigger" placeholder="Enter Password">
      </div>

      <div class="field">
        <i class="fa fa-lock"></i>
        <input type="password" class="password-trigger" placeholder="Confirm Password">
      </div>
          <div class="forgot">Forgot Password?</div>
      <button class="signup-btn">SIGN UP</button>
          <p class="or">Or Login with</p>

      <div class="social">
        <button class="fb"><i class="fab fa-facebook-f"></i> Facebook</button>
        <button class="gm"><i class="fa fa-envelope"></i> G-Mail</button>
      </div>

      <p class="login-text">Already have an account? <span>Login Now</span></p>

      <div class="feet-container">
        <div class="foot">
          <div class="toes"></div>
        </div>
        <div class="foot">
          <div class="toes"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
